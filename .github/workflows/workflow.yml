name: CI/CD

on:
  push:
    branches:
      - master
    # Allowlist, not paths-ignore. A push that matches nothing gets no run at
    # all. That is deliberate: a skipped-but-successful run would still look
    # tested to `dev release` and to release-mode locate-run. No run lets
    # `dev release` walk back to the newest green workflow.yml run. Pull
    # requests use the same list. Use `dir/**` or exact file names.
    paths:
      - 'source/**'
      - 'tests/**'
      - 'samples/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  pull_request:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'source/**'
      - 'tests/**'
      - 'samples/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

# Superseded pull request runs are cancelled. Every other event gets a group of
# its own (run_id), so master, release and dispatch runs are never cancelled or
# queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    # Push, pull request, and workflow_dispatch mode=merge. Release and probe
    # build nothing (the release job).
    if: >-
      ${{ github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode != 'merge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: keep-last-two prune deletes older Packages-* artifacts.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run CI Pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow

      - name: coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: warn

      - name: Upload Artifacts
        # Green master only. Release mode promotes Packages-* from a push run
        # at the tag SHA. PRs, failed runs, probe, and release runs do not
        # upload. The bytes are this job's Release build. GeneratePackageOnBuild
        # is Release-only, and the workflow hash gate refuses the run if the
        # sample or test steps repack those nupkgs or snupkgs.
        id: upload-packages
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:GITHUB_REPOSITORY) -or [string]::IsNullOrEmpty($env:EXPECTED_ARTIFACT)) {
            throw 'GITHUB_REPOSITORY and EXPECTED_ARTIFACT must be set.'
          }
          $raw = @(gh api --paginate `
            -H 'Accept: application/vnd.github+json' `
            "/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" `
            --jq '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | [.created_at, (.id | tostring), .name] | @tsv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sorted = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $raw) {
            if (-not [string]::IsNullOrEmpty($line)) { $sorted.Add($line) }
          }
          $sorted.Sort([System.StringComparer]::Ordinal)
          $sorted.Reverse()
          $listed = $false
          foreach ($line in $sorted) {
            $fields = $line.Split("`t", 3)
            if ($fields.Length -ge 3 -and $fields[2] -ceq $env:EXPECTED_ARTIFACT) {
              $listed = $true
              break
            }
          }
          if (-not $listed) {
            Write-Output "Just-uploaded artifact $env:EXPECTED_ARTIFACT is not listed yet; skipping prune (keep-last-2 runs on the next green master push)."
            exit 0
          }
          $keep = 2
          $n = 0
          foreach ($line in $sorted) {
            $fields = $line.Split("`t", 3)
            if ($fields.Length -lt 3 -or [string]::IsNullOrEmpty($fields[1])) { continue }
            $createdAt = $fields[0]
            $id = $fields[1]
            $name = $fields[2]
            $n++
            if ($n -le $keep) {
              Write-Output "Keeping $name (id=$id, created=$createdAt)"
              continue
            }
            Write-Output "Deleting $name (id=$id, created=$createdAt)"
            gh api --method DELETE "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  release:
    # Release event, break-glass dispatch (mode=release) and the trusted
    # publishing probe. Release mode builds nothing: it promotes the Packages-*
    # artifact from the successful CI run of the tagged commit.
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
      actions: read    # locate-run lists runs and downloads the Packages-* artifact
      packages: read   # check-version reads the org GitHub Packages feed when feeds include it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for the release gate's tag-pin / ancestor checks

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          Write-Output '::error::mode=release requires confirm=release. Refusing to run a break-glass release.'
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: Write-Output 'Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)'

      # Cross-repo repository_dispatch (timewarp-software rebuild) cannot use the
      # default GITHUB_TOKEN. A short-lived installation token is minted from the
      # org's TimeWarp Rebuild Dispatcher GitHub App (org variable REBUILD_APP_ID +
      # org secret REBUILD_APP_PRIVATE_KEY). If the app is not configured the step
      # is skipped and the dispatch degrades to a warning (site rebuilds nightly).
      - name: Mint rebuild dispatch token
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')) && vars.REBUILD_APP_ID != ''
        id: rebuild-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REBUILD_APP_ID }}
          private-key: ${{ secrets.REBUILD_APP_PRIVATE_KEY }}
          owner: TimeWarpEngineering
          repositories: timewarp-software

      - name: Run release pipeline
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')
        env:
          # Job token: locate-run / download-artifact read this repo's Actions
          # runs and artifacts through gh. Do not replace it with the app token.
          GH_TOKEN: ${{ github.token }}
          # App token for the best-effort timewarp-software rebuild dispatch only.
          REBUILD_DISPATCH_TOKEN: ${{ steps.rebuild-token.outputs.token }}
          NUGET_LOGIN_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key $env:NUGET_LOGIN_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
